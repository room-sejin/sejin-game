<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8efdf">
  <title>방구석 세진이</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: #f8efdf;
      font-family: "Malgun Gothic", system-ui, sans-serif;
    }
    .intro {
      position: relative;
      width: min(100%, 66.666667vh);
      width: min(100%, calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 2 / 3));
      aspect-ratio: 2 / 3;
    }
    .intro-art { display: block; width: 100%; height: 100%; }
    /* The artwork's stitched button remains visible beneath the real link. */
    .start {
      position: absolute;
      left: 24.4%;
      top: 80.9%;
      width: 51.2%;
      height: 11.8%;
      border-radius: 999px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .start:hover { background: rgb(255 255 255 / 12%); }
    .start:active { background: rgb(125 167 111 / 16%); }
    .start:focus-visible { outline: 4px solid #714b32; outline-offset: 4px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="intro" aria-labelledby="intro-title">
    <h1 id="intro-title" class="sr-only">방구석 세진이</h1>
    <p class="sr-only">세진이와 함께하는 포근한 하루</p>
    <img class="intro-art" src="assets/maps/intro-concept-v1.png" width="1024" height="1536" alt="파스텔빛 방에서 뜨개질하는 세진이" fetchpriority="high">
    <a class="start" href="design/raising-mockup.html"><span class="sr-only">시작하기</span></a>
  </main>
  <script>
    const startLink = document.querySelector('.start');
    startLink.href += location.search + location.hash;
  </script>
<script src="sejin-bgm.js"></script><script src="sejin-stats.js"></script>
</body>
</html>
