<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>방구석 세진이 · 환영 리본 찾기</title>
<style>
:root{--ink:#5b4a42;--sub:#8b766b;--line:#e9d8c8;--bg:#fbf3ea;--btn:#8fc3e0;--btn-d:#6fa6c4}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
.page{max-width:620px;margin:0 auto;padding:12px 16px 24px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{background:#fff;color:var(--ink);font-size:13px;font-weight:bold;padding:8px 12px;border-radius:12px;box-shadow:0 2px 0 var(--line);text-decoration:none;white-space:nowrap}
.top h1{flex:1;margin:0;font-size:20px}.top h1 small{display:block;font-size:11px;font-weight:normal;color:var(--sub)}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 6px 18px #88756714}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px}
.head b{font-size:16px}.head span{color:var(--sub)}
.scene{position:relative;width:100%;aspect-ratio:1448/1086;border-radius:16px;overflow:hidden;border:3px solid #fff;box-shadow:0 3px 10px #8875672a;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.scene>img.bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bow{position:absolute;width:6%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;padding:0;background:none;cursor:pointer;transition:left .8s cubic-bezier(.3,.8,.3,1),top .8s cubic-bezier(.3,.8,.3,1),width .8s,transform .8s}
.bow img{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 2px 2px #5b4a4244)}
.bow.hid{animation:wig 2.6s infinite}
.bow.got{cursor:default;animation:none;width:7%;transform:translate(-50%,-50%) rotate(-6deg)}
.bow.got.on{animation:pop .5s}
@keyframes wig{0%,88%,100%{transform:translate(-50%,-50%) rotate(0)}92%{transform:translate(-50%,-50%) rotate(-10deg)}96%{transform:translate(-50%,-50%) rotate(10deg)}}
@keyframes pop{50%{transform:translate(-50%,-50%) scale(1.3)}}
.bow.decoy{width:5.5%}.timer{font-weight:bold;color:#e0566d}.timer.ok{color:var(--sub)}
.tip{margin:10px 2px 0;font-size:12px;color:var(--sub);text-align:center;min-height:1.4em}
.done-card{position:fixed;inset:0;display:grid;place-items:center;background:#6d5d5140;padding:16px;z-index:5}
.done-card[hidden]{display:none}
.done-card>div{background:#fffaf0;border-radius:24px;padding:22px 20px;text-align:center;max-width:360px;width:100%;box-shadow:0 10px 35px #88756733}
.done-card h2{margin:6px 0;font-size:21px}.done-card p{color:var(--sub);font-size:14px;line-height:1.6;margin:8px 0 16px}
.acts{display:flex;flex-direction:column;gap:8px}
.acts button,.acts a{border:0;font:inherit;font-weight:bold;font-size:15px;padding:12px;border-radius:14px;background:var(--btn);color:#fff;box-shadow:0 3px 0 var(--btn-d);text-decoration:none;cursor:pointer}
.acts .ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
@media (prefers-reduced-motion:reduce){.bow,.bow.hid,.bow.got.on{animation:none;transition:none}}
</style>
</head>
<body>
<main class="page">
 <div class="top"><a class="back" href="place.html?place=plaza">‹ 광장으로</a><h1>환영 리본 찾기<small id="sub">광장에 숨은 리본을 찾아 진열대를 꾸며요</small></h1></div>
 <div id="stages"></div>
 <section class="card">
  <div class="head"><b>리본 <span id="count" role="status"></span></b><span id="round"></span><span id="timer" class="timer ok"></span></div>
  <div class="scene" id="scene"><img class="bg" src="assets/rooms/event-plaza-clean-v2.jpg" alt="이벤트 광장" draggable="false"></div>
  <p class="tip" id="tip">광장 구석구석에 리본이 숨어 있어요. 찾으면 눌러 주세요!</p>
 </section>
</main>
<div class="done-card" id="doneCard" hidden><div role="dialog" aria-modal="true" aria-labelledby="doneTitle">
 <div style="font-size:42px">🎀</div><h2 id="doneTitle">진열대가 예뻐졌어요!</h2><p id="doneText"></p>
 <div class="acts"><button id="next">다음 스테이지</button><button id="again">다시 하기</button><button class="ghost" id="pickStage">스테이지 선택</button><a class="ghost" href="place.html?place=plaza">광장으로</a></div>
</div></div>
<script src="sejin-save.js"></script><script src="sejin-sfx.js"></script>
<script src="stage-bar.js"></script>
<script>
(()=>{
 'use strict';
 const $=s=>document.querySelector(s),still=matchMedia('(prefers-reduced-motion: reduce)').matches;
 // Four stages, always 6 ribbons (the stall's 6 places; 3 was too short): a time limit, then a time limit, then look-alike props (butterfly, flower…) that cost time when tapped.
 const STAGES=[
  {name:'봄 장터',ribbons:6,decoys:2,time:0},
  {name:'바쁜 장터',ribbons:6,decoys:4,time:15},
  {name:'꽃 섞인 장터',ribbons:6,decoys:7,time:18},
  {name:'저녁 장터',ribbons:6,decoys:9,time:20},
 ];
 // Hiding places on the plaza picture (% of width/height): bushes, crates and corners.
 const HIDE=[{x:8,y:84},{x:92,y:82},{x:44,y:36},{x:19,y:56},{x:58,y:52},{x:4,y:48},{x:95,y:94},{x:33,y:39},{x:52,y:38},{x:66,y:57},{x:3,y:68},{x:97,y:66},{x:12,y:90},{x:40,y:46},{x:62,y:46},{x:22,y:42},{x:70,y:60},{x:25,y:80}];
 const ITEM_OF={9:'ribbon-pink',10:'ribbon-blue',11:'ribbon-purple',12:'ribbon-green'},NAME_OF={'ribbon-pink':'분홍','ribbon-blue':'파란','ribbon-purple':'보라','ribbon-green':'초록'};
 const COLORS=[9,10,11,12],DECOYS=[1,2,3,4,5,7];
 // The stall has two shelves; every ribbon found hangs on the next free place.
 const SHELF=[{x:76,y:40.5},{x:83,y:40.5},{x:90,y:40.5},{x:76,y:49.5},{x:83,y:49.5},{x:90,y:49.5}];
 let stage=1,got,moves,found,over,left,tick,bar;
 const pick=(a,n)=>a.map(v=>[Math.random(),v]).sort((p,q)=>p[0]-q[0]).slice(0,n).map(p=>p[1]);
 const cfg=()=>STAGES[stage-1];
 function start(n){
  stage=n;const c=cfg();StageBar.splash(n,c.name,'리본 '+c.ribbons+'개'+(c.time?' · '+c.time+'초':''));got=0;moves=0;found=[];over=false;clearInterval(tick);$('#doneCard').hidden=true;
  $('#scene').querySelectorAll('.bow').forEach(b=>b.remove());
  $('#sub').textContent=`${n}/${STAGES.length} ${c.name} · 리본 ${c.ribbons}개${c.decoys?' (리본이 아닌 것도 섞여 있어요)':''}${c.time?` · ${c.time}초`:''}`;
  const spots=pick(HIDE,c.ribbons+c.decoys),cols=pick(COLORS.concat(COLORS),c.ribbons),decs=pick(DECOYS,c.decoys);
  spots.forEach((s,i)=>{const isRib=i<c.ribbons,b=document.createElement('button');b.className='bow hid'+(isRib?'':' decoy');b.style.left=s.x+'%';b.style.top=s.y+'%';b.setAttribute('aria-label',isRib?'숨은 리본':'숨은 물건');
   const sprite=isRib?cols[i]:decs[i-c.ribbons];if(isRib)b.dataset.c=cols[i];
   b.innerHTML=`<img src="assets/items/prop-${sprite}.png" alt="">`;b.onclick=()=>isRib?take(b):decoy(b);$('#scene').append(b);});
  $('#scene').onclick=e=>{if(e.target.closest('.bow')||over)return;moves++;$('#tip').textContent='여기엔 없어요. 다른 곳을 찾아봐요.';};
  left=c.time;refresh();$('#tip').textContent='광장 구석구석에 리본이 숨어 있어요. 찾으면 눌러 주세요!';
  if(c.time)tick=setInterval(()=>{left--;refresh();if(left<=0)lose();},1000);
 }
 function refresh(){const c=cfg();$('#count').textContent=`${got} / ${c.ribbons}`;$('#round').textContent='';const t=$('#timer');t.textContent=c.time?`⏱ ${Math.max(0,left)}초`:'';t.className='timer'+(left>10||!c.time?' ok':'');}
 function take(b){window.SejinSfx&&SejinSfx.play('ok');
  if(over||!b.classList.contains('hid'))return;b.classList.remove('hid');b.classList.add('got');
  const s=SHELF[got];got++;
  const item=ITEM_OF[b.dataset.c];if(item){SejinSave.pushResult({game:'pickup',place:'이벤트 광장',items:{[item]:1}});found.push(NAME_OF[item]);}   // into the bag
  requestAnimationFrame(()=>{b.style.left=s.x+'%';b.style.top=s.y+'%';});
  setTimeout(()=>b.classList.add('on'),800);
  refresh();$('#tip').textContent=got<cfg().ribbons?'찾았다! 진열대에 걸었어요.':'';
  if(got===cfg().ribbons)win();
 }
 function decoy(b){window.SejinSfx&&SejinSfx.play('wrong');
  if(over||!b.classList.contains('hid'))return;b.classList.remove('hid');b.style.opacity='.35';b.style.animation='none';moves++;
  if(cfg().time){left=Math.max(0,left-3);refresh();$('#tip').textContent='앗, 리본이 아니에요! 시간이 3초 줄었어요.';if(left<=0)lose();}else $('#tip').textContent='이건 리본이 아니에요.';
 }
 function win(){window.SejinSfx&&SejinSfx.play('win');
  over=true;clearInterval(tick);const c=cfg();
  const stars=c.time?(left>=c.time*.5?3:left>=c.time*.2?2:1):(moves<=2?3:moves<=6?2:1);
  const res=StageBar.clear('ribbon',stage,stars),yarn=res.first?4+stage*2:2;
  if(stage===STAGES.length)SejinSave.clears.mark('ribbon');   // the last stage clears the game (angel mission)
  SejinSave.pushResult({game:'minigame',label:`환영 리본 찾기 ${stage}단계`,place:'이벤트 광장',first:res.first,yarn});
  bar.refresh();
  $('#doneTitle').textContent=`${stage}단계 클리어! ${StageBar.stars(stars)}`;
  $('#doneText').innerHTML=`리본 ${c.ribbons}개를 모두 찾았어요.<br>🎀 <b>${found.join(' · ')} 리본</b>이 소지품에 들어갔어요.<br>실뭉치 <b>+${yarn}개</b>도 방에 가면 들어와요.<br><small>리본은 공방에서 소품을 만들 때 쓸 수 있어요.</small>`+(res.first&&stage<STAGES.length?'<br>다음 스테이지가 열렸어요!':'');
  $('#next').hidden=stage>=STAGES.length;$('#again').textContent='다시 하기';
  setTimeout(()=>{$('#doneCard').hidden=false;($('#next').hidden?$('#again'):$('#next')).focus();},still?0:1400);
 }
 function lose(){
  if(over)return;over=true;clearInterval(tick);
  $('#doneTitle').textContent='시간 끝!';$('#doneText').innerHTML=`리본 ${got}개를 찾았어요. 찾은 리본은 이미 소지품에 들어갔어요.<br>한 번 더 도전해 볼까요?`;
  $('#next').hidden=true;$('#again').textContent='다시 도전';$('#doneCard').hidden=false;$('#again').focus();
 }
 $('#again').onclick=()=>start(stage);$('#next').onclick=()=>{bar.current=stage+1;bar.refresh();start(stage+1);};
 const done=SejinSave.stages.get().ribbon||{};let first=1;while(first<STAGES.length&&done[first])first++;
 bar=StageBar.mount($('#stages'),{game:'ribbon',title:'환영 리본 찾기',names:STAGES.map(s=>s.name),subs:STAGES.map(s=>'리본 '+s.ribbons+'개'+(s.time?' · '+s.time+'초':'')),current:first,autoOpen:true,onPick:start});
 $('#pickStage').onclick=()=>{clearInterval(tick);$('#doneCard').hidden=true;bar.open();};
})();
</script>
<script src="sejin-hud.js"></script><script src="sejin-from.js"></script>
</body>
</html>
