<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>방구석 세진이 · 대저택의 비밀</title>
<style>
:root{--ink:#5b4a42;--sub:#8b766b;--line:#e9d8c8;--btn:#b9a3e3;--btn-d:#9a84c8;--ok:#7fb88a}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:linear-gradient(#efe6fa,#fbeef3);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
.page{max-width:1000px;margin:0 auto;padding:12px 16px 28px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{background:#fff;color:var(--ink);font-size:13px;font-weight:bold;padding:8px 12px;border-radius:12px;box-shadow:0 2px 0 var(--line);text-decoration:none;white-space:nowrap;border:0;cursor:pointer}
.top h1{flex:1;margin:0;font-size:20px}.top h1 small{display:block;font-size:11px;font-weight:normal;color:var(--sub)}
.tools{display:flex;gap:6px}.tools button{border:0;background:#fff;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:bold;box-shadow:0 2px 0 var(--line);cursor:pointer}
.card{background:#fff;border-radius:22px;padding:10px;margin-bottom:10px;box-shadow:0 6px 18px #88756722}
[hidden]{display:none!important}
.roof{text-align:center;font-weight:bold;font-size:13px;color:#8b766b;margin:0 0 8px}
.hall-scene{position:relative;aspect-ratio:4/3;background:#e9dff4;border-radius:15px;overflow:hidden}
.hall-scene>img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.doors{position:absolute;inset:0}
.hall-note{text-align:center;color:var(--sub);font-size:13px;line-height:1.6;margin:8px 0 0}
.hall-door{position:absolute;width:17%;height:25%;transform:translateX(-50%);background:transparent;border:3px solid transparent;border-radius:45% 45% 8px 8px;cursor:pointer;padding:0;display:flex;align-items:flex-end;justify-content:center}
.hall-door span{background:#fffaf0ed;border:2px solid #c6ad94;border-radius:10px;padding:4px 5px;font-size:clamp(9px,1.6vw,14px);font-weight:bold;line-height:1.25;text-align:center}
.hall-door:hover:not(:disabled),.hall-door:focus-visible{border-color:#ebc272;background:#fff4c62b;outline:none}
.hall-door:disabled{cursor:default}.hall-door:disabled span{background:#eee9f0da;color:#927e9e}
.hall-door.done span{background:#e0f1dd}.hall-door.next{border-color:#f5d58a;animation:glow 1.6s ease-in-out infinite}.hall-door.next span{background:#fff3c2}
@keyframes glow{50%{background:#fff4c64a}}
.stage{position:relative;aspect-ratio:4/3;border-radius:15px;overflow:hidden;background:#e9dff4}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .name{position:absolute;left:10px;top:10px;background:#fffaf2ed;border-radius:12px;padding:6px 10px;font-weight:bold;font-size:14px}
.hs{position:absolute;transform:translate(-50%,-50%);width:clamp(30px,5.2vw,46px);height:clamp(30px,5.2vw,46px);border-radius:50%;border:3px solid #fff;background:#8fc3e0cc;color:#fff;font-weight:bold;font-size:clamp(13px,2vw,18px);cursor:pointer;padding:0;box-shadow:0 2px 6px #5b4a4260;z-index:2}
.hs.go{background:#f2b94dee;animation:hsp 1.4s ease-in-out infinite}.hs.ok{background:#7fb88aee}.hs.lock{background:#9a8fa8aa;font-size:12px}
@keyframes hsp{50%{box-shadow:0 0 0 9px #fff6,0 2px 6px #5b4a4260;transform:translate(-50%,-50%) scale(1.08)}}
.hs:focus-visible{outline:3px solid #5b4a42}
.inv{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}.inv span{background:#fff8ec;border:2px solid var(--line);border-radius:10px;padding:3px 8px;font-size:13px;font-weight:bold}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.step{border:3px solid #fff;background:#fffaf4;border-radius:14px;box-shadow:0 3px 0 var(--line);padding:8px 4px;font-size:12px;font-weight:bold;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.25}
.step i{font-style:normal;font-size:22px}
.step.go{border-color:#f5d58a;background:#fff8dc}.step.ok{background:#e3f3e1;color:#4f8a4f}.step:disabled{opacity:.5;cursor:default}
.msg{margin:10px 2px 0;font-size:13px;color:var(--sub);text-align:center;min-height:1.5em;line-height:1.5}
.sheet{position:fixed;inset:0;background:#6d5d5155;display:grid;place-items:center;padding:12px;z-index:6;overflow:auto}
.sheet>div{background:#fffaf0;border-radius:22px;padding:16px;width:100%;max-width:560px;max-height:94dvh;overflow:auto;box-shadow:0 10px 35px #88756744}
.sheet h2{margin:0;font-size:18px;flex:1}
.sh-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.xbtn{border:0;background:#fff;border-radius:10px;padding:6px 10px;font-weight:bold;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.clue{background:#fff3d6;border:2px dashed #e2c98e;border-radius:14px;padding:10px;font-size:13px;line-height:1.7;margin-bottom:10px}
.clue b{color:#8a5b2e}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin:8px 0}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.slot{min-width:54px;min-height:54px;border:3px dashed #cdb8a3;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:bold;background:#fff;padding:4px;text-align:center}
.slot.f{border-style:solid;border-color:var(--ok);background:#eef8ec}
.slot.t{flex-direction:column;gap:2px}
.chip,.btn{border:3px solid #fff;background:#fffaf4;color:var(--ink);font-weight:bold;font-size:14px;padding:8px 12px;border-radius:12px;box-shadow:0 3px 0 var(--line);cursor:pointer;min-height:44px}
.chip.sel{border-color:#f5d58a;background:#fff3c2;transform:translateY(-3px)}
.chip:disabled{opacity:.4;cursor:default}
.chip svg{display:block;margin:0 auto}
.btn.main{background:var(--btn);color:#fff;box-shadow:0 3px 0 var(--btn-d);border-color:var(--btn)}
.big{font-size:26px;line-height:1.2}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin:8px 0}
.keypad .chip{height:52px;font-size:20px}
.code{display:flex;gap:8px;justify-content:center;margin:6px 0}
.code div{width:46px;height:56px;border:3px solid #8a6f60;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:26px;font-weight:bold}
.code small{display:block;font-size:12px;text-align:center}
.stp{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0;font-weight:bold}
.stp .lab{min-width:96px;text-align:right}.stp .v{min-width:34px;text-align:center;font-size:22px}
.stp .chip{padding:4px 14px;min-height:40px;font-size:18px}
.grid{display:grid;gap:4px;justify-content:center;margin:8px auto;touch-action:manipulation}
.cell{border:2px solid #d8c5b0;background:#fff;border-radius:6px;display:grid;place-items:center;font-weight:bold;position:relative}
.cell.hole{border-color:#8fc3e0}.cell.cover{background:#4a3f58;border-color:#4a3f58;color:transparent}
.good{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.07)}}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.memo{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;font-size:14px;line-height:1.7}
.memo b{display:block;color:#8a5b2e;font-size:12px}
.ghost{background:#fff;color:var(--ink)}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pot{display:flex;flex-direction:column;align-items:center;gap:4px}
.cup{display:flex;flex-direction:column-reverse;gap:2px;width:46px;height:100px;border:3px solid #8a6f60;border-radius:6px 6px 18px 18px;background:#fff;padding:2px}
.cup i{flex:1;background:#8fc3e0;border-radius:3px}.cup i.e{background:transparent}
.face{position:relative;width:170px;height:170px;border-radius:50%;background:#fffdf8;border:5px solid #8a6f60;margin:6px auto}
.face i{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:4px;background:#5b4a42}
.face .hh{width:6px;height:46px;margin-left:-3px}.face .mm{width:4px;height:68px;margin-left:-2px;background:#8a6f60}
.face b{position:absolute;font-size:12px}.face .dot{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:#8a6f60}
.mirror{display:flex;gap:10px;justify-content:center;align-items:center;margin:8px 0}
.mirror .pane{flex:1;max-width:220px;height:90px;border:3px solid #8a6f60;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:44px;font-weight:bold;letter-spacing:6px}
.mirror .glass{background:linear-gradient(135deg,#e8f3fb,#fff,#d9e9f6)}
.lg{margin:0 0 10px;padding:10px 12px 10px 30px;background:#fffbe9;border:2px solid #ead9a8;border-radius:12px;font-size:13px;line-height:1.75}
.sheet>div{background:linear-gradient(#fffdf6,#fff6e2);border:3px solid #e7d3a7;box-shadow:0 10px 35px #88756744,inset 0 0 0 4px #fffaf0}
.sheet h2{font-size:19px;color:#6b4a3a}
.big-num{font-size:30px;font-weight:bold;letter-spacing:4px}
.cup{position:relative}.cupwrap{display:flex;gap:18px;justify-content:center;align-items:flex-end;margin:10px 0}.cupwrap .lab{font-size:12px;font-weight:bold;text-align:center}
.pegs{display:flex;gap:10px;justify-content:center;margin:10px 0}.peg{flex:1;max-width:150px;min-height:150px;background:#fff;border:3px solid #cdb8a3;border-radius:14px;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;padding:8px 4px;cursor:pointer;position:relative}.peg.sel{border-color:#f5c04a;background:#fff6d8}.peg:after{content:'';position:absolute;left:50%;bottom:6px;top:10px;width:6px;margin-left:-3px;background:#cdb8a3;border-radius:3px;z-index:0}.disc{height:22px;border-radius:11px;border:2px solid #8a6f60;z-index:1}
.tiles{display:grid;gap:6px;justify-content:center;margin:10px auto}.tile{width:64px;height:64px;border:3px solid #8a6f60;border-radius:12px;background:#fff;font-size:26px;font-weight:bold;cursor:pointer;display:grid;place-items:center;padding:0}.tile.blank{background:transparent;border-style:dashed;border-color:#cdb8a3;cursor:default}
.scale-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;margin:8px 0}.pan{min-height:70px;background:#fff;border:3px dashed #cdb8a3;border-radius:14px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:flex-start;padding:6px}
@media(max-width:560px){.steps{gap:5px}.step{font-size:11px;padding:6px 2px}.top h1{font-size:17px}}
</style>
</head>
<body>
<main class="page">
 <div class="top"><a class="back" href="village.html">‹ 천사 마을로</a><h1>대저택의 비밀<small>돌아오는 친구를 위한 선물의 저택 · 방 8개, 단계 40개</small></h1><div class="tools"><button type="button" id="bStory" aria-label="이야기 기록장">📜</button><button type="button" id="bNote" aria-label="단서 기록장">📒</button></div></div>
 <div class="card" id="hall"><div class="roof" id="hallTitle">보랏빛 저택 · 중앙홀</div><div class="hall-scene"><img id="hallImg" alt="두 층에 여러 문이 있는 넓은 저택 중앙홀" hidden><div class="doors" id="doors"></div></div><p class="hall-note" id="hallNote"></p><div class="inv" id="inv"></div></div>
 <div class="card" id="roomCard" hidden>
  <button type="button" class="back" id="toHall">‹ 중앙홀로</button>
  <div class="stage" style="margin-top:8px"><img id="roomImg" alt=""><div class="name" id="roomName"></div><div id="hots"></div></div>
  <div class="steps" id="steps"></div>
  <p class="msg" id="roomMsg"></p>
 </div>
 <p style="text-align:center;margin:14px 0 0"><button type="button" class="back" id="bReset" style="font-size:12px;color:var(--sub)">진행 처음부터 다시 하기</button></p>
</main>
<div class="sheet" id="sheet" hidden><div id="sheetBox"></div></div>
<script src="sejin-save.js"></script><script src="sejin-sfx.js"></script><script src="mansion-escape.js"></script><script src="mansion-layton.js"></script>
<script src="sejin-hud.js"></script><script src="sejin-from.js"></script>
</body>
</html>
