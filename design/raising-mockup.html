<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>세진이 키우기 · 화면 시안</title>
<style>
:root{--ink:#594c43;--sub:#887b70;--wall:#f6ede3;--floor:#efdcc3;--card:#fffaf0;--line:#e7dccd;--sky:#8fc3e0;--pink:#f2a7b5;--butter:#f5d58a;--sage:#a9cfa4;--lav:#c9b3e6;--btn:#81b7c5;--btn-d:#6495a2;font-family:"Malgun Gothic",system-ui,sans-serif;color:var(--ink)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#e7f3f5,transparent 65%),#faf6ef;display:flex;flex-direction:column;align-items:center;padding:20px 12px}
.note{font-size:12px;color:var(--sub);margin:0 0 12px;text-align:center}
.note b{color:#6e969e;letter-spacing:1px}
.phone{width:100%;max-width:400px;background:#fff;border-radius:30px;padding:8px;box-shadow:0 14px 45px #75655222}
.app{background:var(--wall);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;min-height:760px}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.lv{flex:1}
.lv small{font-size:11px;color:var(--sub)}
.lv strong{font-size:15px;margin-right:6px}
.bar{height:8px;background:#e9dccb;border-radius:8px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:8px;background:var(--pink);transition:width .3s}
.yarn{display:flex;align-items:center;gap:6px;background:#fff9;border:1px solid #fff;border-radius:20px;padding:6px 12px;font-weight:bold;font-size:14px}
.ball{width:16px;height:16px;border-radius:50%;background:var(--sky);border:1.5px solid #8a6f60;background-image:repeating-linear-gradient(-30deg,transparent 0 3px,#5f413740 3px 4px)}
.panel{flex:1;display:none;flex-direction:column}
.panel.on{display:flex}
/* Room scene */
.room{position:relative;height:300px;margin:0 12px;border-radius:20px;overflow:hidden;transition:background-color .4s;background:linear-gradient(var(--wp,#f6ede3) 0 72%,#e3cfb6 72% 75%,var(--floor) 75%)}
.room.night{filter:brightness(.72) saturate(.8)}
.window{position:absolute;left:22px;top:26px;width:86px;height:110px;border-radius:44px 44px 6px 6px;background:#d4ebef;border:6px solid #e2d3bf}
.window::before,.window::after{content:"";position:absolute;background:#fbf7ec}
.window::before{left:calc(50% - 3px);top:0;bottom:0;width:6px}.window::after{left:0;right:0;top:48%;height:6px}
.room.night .window{background:#6d7fa6}
.shelf{position:absolute;right:22px;top:70px;width:128px;height:8px;background:#dcc4a4;border:1.5px solid #8a6f60;border-radius:3px}
.shelf span{position:absolute;bottom:8px;width:20px;height:20px;border-radius:50%;border:1.5px solid #8a6f60}
.shelf .doll{position:absolute;bottom:8px;right:6px;width:30px;height:37px}
.sejin{position:absolute;left:50%;bottom:34px;width:118px;aspect-ratio:.806;transform:translateX(-50%);background:url(../assets/character/base-v1.png) 51% 58.5%/150.9% 128.1% no-repeat;cursor:pointer;border:0;padding:0;box-shadow:none;border-radius:0;animation:idle 2.4s ease-in-out infinite}
.sejin:focus-visible{outline:3px solid #5e5953;outline-offset:4px}
@keyframes idle{50%{transform:translateX(-50%) translateY(-4px) scaleY(.985)}}
.room.night .sejin{animation:none;filter:brightness(.9)}
.coin{position:absolute;left:calc(50% - 11px);bottom:96px;width:22px;height:22px;border-radius:50%;border:1.5px solid #8a6f60;background-image:repeating-linear-gradient(-30deg,transparent 0 3px,#5f413740 3px 4px);pointer-events:none;z-index:3}
.plus{position:absolute;left:50%;bottom:178px;transform:translateX(-50%);font-weight:bold;font-size:18px;color:#c77683;text-shadow:0 2px 0 #fff,0 0 6px #fff;pointer-events:none;z-index:3}
.yarn.bump{animation:bump .3s}@keyframes bump{50%{transform:scale(1.15)}}
.goal{grid-column:1/-1;display:block;width:calc(100% - 16px);margin:0 8px 8px;border:0;border-radius:14px;background:#fff;box-shadow:0 2px 0 #e9d8c8;padding:9px 12px;font:inherit;font-size:13px;font-weight:bold;color:#5b4a42;text-align:left;cursor:pointer}.goal small{display:block;font-weight:normal;font-size:11px;color:#8b766b;margin-top:1px}
.bubble{position:absolute;left:50%;top:18px;transform:translateX(-50%);max-width:70%;background:#fff;border-radius:16px;padding:9px 14px;font-size:13px;line-height:1.5;text-align:center;box-shadow:0 4px 14px #88756722}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.dust{position:absolute;bottom:30px;width:22px;height:16px;border-radius:50%;background:#cfc4b8;box-shadow:inset -3px -3px 0 #b9ada1;opacity:0;transition:opacity .4s}
.room.dirty .dust{opacity:1}
.zz{position:absolute;left:calc(50% + 40px);top:110px;font-weight:bold;color:#fff;font-size:20px;opacity:0}
.room.night .zz{opacity:1}
/* Needs */
.needs{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:14px 18px 6px}
.need{font-size:12px;color:var(--sub)}
.need div{display:flex;justify-content:space-between}
.need b{color:var(--ink)}
.need.low b{color:#c77683}
.care{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px}
/* Neighbourhood map */
.map{position:relative;margin:0 12px;border-radius:20px;overflow:hidden;aspect-ratio:36/32;background:#dcebd0;border:3px solid #fff;box-shadow:0 6px 20px #8875670f}
.map svg,.map .map-art{position:absolute;inset:0;width:100%;height:100%}
.map .map-art{object-fit:cover;user-select:none}
.pin{position:absolute;transform:translate(-50%,-100%);background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line);border-radius:12px;padding:5px 10px;font-size:12px;white-space:nowrap;z-index:1}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff}
.pin.soon{color:var(--sub)}.pin.lock{background:#fff;color:#7a6a60}.pin.lock small{color:#e58c9c;font-weight:bold;opacity:1}
.pin[aria-pressed=true]{background:var(--btn);color:#fff;box-shadow:0 2px 0 var(--btn-d)}.pin[aria-pressed=true]::after{border-top-color:var(--btn)}
.q a.play{padding:8px 12px;font-size:13px;text-decoration:none;color:#fff;background:var(--btn);border-radius:12px;font-weight:bold;box-shadow:0 3px 0 var(--btn-d)}
.sfxbtn{margin-left:6px;border:0;background:#fffaf4;border-radius:999px;width:30px;height:30px;font-size:15px;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.mapq{margin:0 0 10px;padding:8px 10px;border-radius:16px;background:#fff;border:2px dashed #cdbfe9;display:grid;gap:5px}.mapq[hidden]{display:none}.mqt{font-size:12px;font-weight:bold;color:#8b766b}
.mq{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:#f6f0fb;border-radius:12px;padding:7px 10px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;text-align:left}.mq small{color:var(--sub);font-size:11px;margin-left:3px}.mq b{font-size:12.5px;white-space:nowrap}.mq.ok{background:#fff3cf}
.pin .qm{position:absolute;right:-12px;top:-17px;width:24px;height:24px;border-radius:50%;background:#ffd23f;border:3px solid #fff;color:#5b3a1e;font-size:15px;font-weight:900;line-height:18px;text-align:center;box-shadow:0 2px 0 #c99a1a,0 0 0 2px #5b3a1e55;animation:qb2 1.1s ease-in-out infinite}.pin .qm.q2{background:#8fd3ff;box-shadow:0 2px 0 #4a9fcf,0 0 0 2px #1e3a5b55;color:#16384f}
.qb{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#ffd23f;border:2px solid #fff;color:#5b3a1e;font-style:normal;font-weight:900;font-size:13px;line-height:1;box-shadow:0 1px 0 #c99a1a,0 0 0 1.5px #5b3a1e44;vertical-align:middle}.qb.q2{background:#8fd3ff;color:#16384f;box-shadow:0 1px 0 #4a9fcf,0 0 0 1.5px #1e3a5b44}.q a.play .qb{width:18px;height:18px;font-size:12px}@keyframes qb2{50%{transform:translateY(-4px)}}
.pin small{font-size:9px;margin-left:3px;opacity:.8}
.walker{position:absolute;width:9%;aspect-ratio:.806;transform:translate(-50%,-92%);background:url(../assets/character/base-v1.png) 51% 58.5%/150.9% 128.1% no-repeat;transition:left .7s ease-in-out,top .7s ease-in-out;z-index:2;pointer-events:none}
/* Map: invisible tap areas over buildings, bright pop-up info card */
.map-zone{position:absolute;border:0;padding:0;background:transparent;box-shadow:none;cursor:pointer;border-radius:18px;z-index:1}
.map-zone:hover{background:#ffffff26}
.place-pop{position:absolute;left:10px;right:10px;bottom:10px;z-index:4;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-radius:18px;background:#fffffffa;border:2px solid #fff;box-shadow:0 8px 24px #5b4a4233;color:var(--ink)}
.place-pop.at-top{bottom:auto;top:10px}
.place-pop[hidden]{display:none}
.place-pop .pop-dot{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #8a6f60}
.place-pop .pop-txt{flex:1;min-width:0}
.place-pop b{font-size:15px;color:#4a3a33}
.place-pop p{margin:3px 0 0;font-size:12.5px;line-height:1.4;color:#6b5a50}
.place-pop .tag{background:#eee4d8;color:#6b5a50}.place-pop .tag.on{background:#a9cfa4;color:#fff}
.place-pop [data-enter],.place-pop button[disabled]{flex:none;border:0;font:inherit;font-size:13px;font-weight:bold;padding:10px 14px;border-radius:12px;background:var(--btn);color:#fff;box-shadow:0 3px 0 var(--btn-d);cursor:pointer}
.place-pop button[disabled]{background:#cfc2b5;box-shadow:0 3px 0 #b5a697;cursor:default}
@media (max-width:520px){.place-pop,.place-pop.at-top{position:fixed;top:auto;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:30}}
.place-pop .pop-x{position:absolute;top:-8px;right:-6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:#8a6f60;color:#fff;font-size:12px;line-height:1;padding:0;cursor:pointer}
@media (prefers-reduced-motion:reduce){.walker{transition:none}}
.back{background:none;box-shadow:none;color:var(--sub);padding:4px 0;font-size:13px}
.tag{display:inline-block;font-size:10px;font-weight:bold;border-radius:8px;padding:2px 7px;margin-left:4px;vertical-align:2px;background:#f1e4d3;color:var(--sub)}
button{font-family:inherit;border:0;border-radius:14px;background:var(--btn);color:#fff;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 var(--btn-d)}
button:hover{filter:brightness(1.05)}button:focus-visible{outline:3px solid #5e5953;outline-offset:3px}
.care button{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);padding:10px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:5px}
.care i{width:26px;height:26px;border-radius:50%;border:1.5px solid #8a6f60}
.quest{margin:6px 14px 14px;background:var(--card);border:1px solid #fff;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px #8875670f}
.quest p{margin:0;font-size:13px;flex:1;line-height:1.5}.quest small{color:var(--sub)}
.quest button{padding:10px 14px;font-size:13px}
/* Lists */
.head{padding:6px 18px 4px}.head h2{margin:4px 0;font-size:19px}.head p{margin:0;font-size:12px;color:var(--sub)}
.list{display:flex;flex-direction:column;gap:10px;padding:10px 14px}
.item{background:var(--card);border:1px solid #fff;border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center}
.item.locked{opacity:.55}
.thumb{width:56px;height:56px;border-radius:14px;background:#f1e4d3;flex:none;display:grid;place-items:center;position:relative}
.thumb .doll{width:38px;height:47px}
.item>div:not(.thumb){flex:1}.item b{font-size:14px}.item p{margin:3px 0 0;font-size:12px;color:var(--sub)}
.item button,.item a.play{padding:9px 12px;font-size:13px;text-decoration:none;color:#fff;background:var(--btn);border-radius:12px;font-weight:bold;box-shadow:0 3px 0 var(--btn-d)}
.item button:disabled{background:#cbbfb2;box-shadow:0 3px 0 #b5a99c;cursor:default}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:10px 14px}
.slot{min-width:0;background:var(--card);border-radius:16px;aspect-ratio:1;display:grid;place-items:center;font-size:11px;color:var(--sub);text-align:center;border:1px solid #fff}
.slot .doll{width:46px;height:57px;margin:0 auto 4px}
.slot .doll.unknown{filter:brightness(0) opacity(.12)}
.doll{background:url(../assets/character/base-v1.png) 51% 58.5%/150.9% 128.1% no-repeat;display:block}
/* Doll book card: before (stitched outline, pale silhouette) → after (colour card, doll, 완성 ribbon, NEW) */
.book-doll{position:relative;overflow:visible;padding:8px 4px;transition:background .4s;width:100%;font:inherit;font-weight:normal;color:var(--sub);box-shadow:none;cursor:pointer}
.book-doll.made{box-shadow:0 4px 12px #8fc3e033}
.doll-detail{width:150px;height:auto;aspect-ratio:1;margin:0 auto 10px;border-radius:24px;display:grid;place-items:center;cursor:default}
.doll-detail .doll-art{width:62%}
.doll-about{text-align:center;font-size:13px;color:#6b5a50;margin:0 8px 12px;line-height:1.5}
.doll-act{text-align:center}.doll-act button{padding:11px 18px;font-size:14px}.doll-act button[disabled]{background:#cfc2b5;box-shadow:0 3px 0 #b5a697;cursor:default}
.book-doll>div{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px}
.book-doll .doll-art{display:block;width:56%;aspect-ratio:.806;background:url(../assets/character/base-v1.png) 51% 58.5%/150.9% 128.1% no-repeat}
.book-doll b{font-size:12px;color:var(--ink)}.book-doll small{font-size:10px;line-height:1.3}
.book-doll.todo{background:repeating-linear-gradient(-45deg,#fbf6ee 0 8px,#f6efe4 8px 16px);border:2px dashed #d9c7b2}
.book-doll.todo.next{border:2px solid #f2a7b5;background:#fff3f5;box-shadow:0 0 0 3px #f2a7b555}.book-doll.todo.next small{color:#c0566b;font-weight:bold}.bprog{display:block;height:8px;border-radius:99px;background:#eadfce;margin-top:6px;overflow:hidden}.bprog i{display:block;height:100%;background:#f2a7b5;border-radius:99px}
.book-doll.todo .doll-art{filter:brightness(0) opacity(.13)}
.book-doll .doll-art.no-art{background:#fffdf8;border:2px dashed #cdbba8;border-radius:14px;display:grid;place-items:center;font-size:10px;color:#8b766b;line-height:1.3;animation:none}
.book-doll.todo b{color:var(--sub);letter-spacing:2px}
.book-doll.avail{background:#fff8dc;border:2px dashed #e3b84d;box-shadow:0 0 0 3px #fff3b0}.book-doll.avail .doll-art{width:56%;animation:dollBob 2.2s ease-in-out infinite}.book-doll.avail small{color:#a67c1a}
.book-doll.made{background:radial-gradient(circle at 50% 38%,#fffdf8 0 34%,#e4f0f4 35% 100%);border:2px solid #fff;box-shadow:0 4px 12px #8fc3e033}
.book-doll.made .doll-art{filter:drop-shadow(0 3px 0 #8a6f6022);animation:dollBob 2.8s ease-in-out infinite}
.book-doll.made::before{content:"완성";position:absolute;top:6px;left:6px;padding:1px 7px;border-radius:9px;background:var(--sage);color:#fff;font-size:10px;font-weight:bold}
.new-tag{position:absolute;top:-6px;right:-4px;padding:2px 7px;border-radius:10px;background:#e58c9c;color:#fff;font-size:10px;font-style:normal;font-weight:bold;box-shadow:0 2px 0 #c96f80;animation:newPop .6s ease-out}
@keyframes dollBob{50%{transform:translateY(-3px) rotate(-2deg)}}
@keyframes newPop{0%{transform:scale(0)}70%{transform:scale(1.25)}}
/* Feeding: bowl above Sejin, 냠냠 text */
.food-bowl{position:absolute;left:0;top:0;width:52px;margin:-26px 0 0 -26px;z-index:5;pointer-events:none}
.food-bowl svg{display:block;width:100%}
.munch{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-weight:bold;font-size:15px;color:#e58c9c;text-shadow:0 2px 0 #fff,0 0 6px #fff;z-index:5;pointer-events:none;white-space:nowrap}
.crumb{position:absolute;left:0;top:0;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;z-index:5;pointer-events:none}
/* Sleeping: the 재우기 button shows a countdown */
.care button.sleeping{opacity:.75;cursor:default}
@media (prefers-reduced-motion:reduce){.book-doll.made .doll-art,.new-tag{animation:none}}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line)}
nav button{background:none;box-shadow:none;color:var(--sub);border-radius:0;padding:12px 0 14px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button i{width:20px;height:20px;border-radius:7px;background:var(--line)}
nav button[aria-selected=true]{color:var(--ink)}nav button[aria-selected=true] i{background:var(--sky)}
nav button i.heart-ico{background:#f2a7b5;border-radius:50% 50% 8px 50%;transform:rotate(45deg) scale(.82)}
nav button[aria-selected=true] i.heart-ico{background:#e58c9c}
/* The room scene grows to fill the free height so the screen has no empty band above the tabs */
#p-room .room{flex:1;height:auto;min-height:300px}
/* Wall items keep their distance from the floor line (72% down) instead of the ceiling. */
#p-room .window{top:auto;bottom:calc(28% + 68px)}
#p-room .shelf{top:auto;bottom:calc(28% + 146px)}
#p-room .shelf2{top:auto;bottom:calc(28% + 26px)}
#p-room .side{top:auto;bottom:calc(28% + 15px)}
/* Sejin (and what floats above Sejin) scales with the room height. */
#p-room .room{--sw:118px}
#p-room .sejin{width:var(--sw)}
#p-room .bubble{top:auto;bottom:calc(46px + var(--sw) * 1.24)}
#p-room .plus{left:calc(50% + var(--sw) * .5);bottom:calc(16px + var(--sw) * 1.1)}
#p-room .gain{bottom:calc(90px + var(--sw) * 1.24)}
#p-room .coin{bottom:calc(34px + var(--sw) * .55)}
.bunting{position:absolute;left:0;top:50px;width:100%;height:46px;pointer-events:none}
.room.deco-lights .bunting{top:84px}
.room.short .bunting{display:none}
#p-room .lights{top:46px}
/* Top toolbar: decorate, closet, diary */
.tools{position:absolute;left:10px;top:10px;display:flex;gap:6px;z-index:2}
.tool{display:flex;align-items:center;gap:4px;padding:6px 10px 6px 8px;border-radius:12px;background:#fffd;color:var(--ink);box-shadow:0 2px 0 var(--line);font-size:11px}
.tool svg{width:17px;height:17px}
/* Clothes drawn on top of Sejin (positions in % of the Sejin picture) */
.acc{position:absolute;display:block;pointer-events:none}.acc svg{display:block;width:100%;height:auto}
.sec{font-size:13px;font-weight:bold;color:var(--sub);margin:4px 4px 8px}
.swatches{display:flex;gap:10px;padding:2px 4px 14px}
.sw{width:42px;height:42px;padding:0;border-radius:12px;border:2px solid #fff;box-shadow:0 2px 0 var(--line)}
.sw[aria-pressed=true]{outline:3px solid var(--btn);outline-offset:2px}
.closet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.cloth{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:16px;border:2px solid #fff;background:var(--card);color:var(--ink);box-shadow:none;font-size:12px}
.cloth svg{height:30px;width:auto}.cloth small{color:var(--sub);font-weight:normal;font-size:11px}
.cloth[aria-pressed=true]{border-color:var(--btn);background:#eef6f8}
.cats{display:flex;gap:6px;margin-bottom:2px}
.cat{padding:8px 14px;border-radius:20px;background:#fff;color:var(--sub);box-shadow:0 2px 0 var(--line);font-size:13px}
.cat[aria-selected=true]{background:var(--btn);color:#fff;box-shadow:0 2px 0 var(--btn-d)}
.thumb svg{width:38px;height:auto}
.diary{background:#fffdf7;border-radius:14px;padding:6px 16px 14px;min-height:220px;line-height:28px;font-size:13px;background-image:repeating-linear-gradient(transparent 0 27px,#eee3d4 27px 28px);background-position:0 6px}
.diary h4{margin:0;font-size:13px;color:var(--sub)}.diary p{margin:0}.diary small{color:var(--sub)}
#p-room .care{padding-bottom:16px}
/* Side icons in the room: bag and challenges */
.side{position:absolute;right:10px;top:92px;display:flex;flex-direction:column;gap:9px;z-index:2}
.side-btn{position:relative;width:46px;height:50px;padding:0;border-radius:14px;background:#fffd;color:#8a6f60;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px}
.side-btn svg{width:22px;height:22px}
.side-btn em{position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;border:2px solid #fff;background:#e58c9c;color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center}
.side-btn em:empty{display:none}

<script>
const $=s=>document.querySelector(s);
const needs={배부름:62,청결:34,기분:70,에너지:80};
let xp=40,yarn=120,night=false;
// Energy clock (see SejinSave.ENERGY): regenAt = start of the current +1 regen step; napReadyAt = when a nap is possible again.
let regenAt=Date.now(),napReadyAt=0;
const REPEAT_YARN_LIMIT=80;let repeatYarnToday=0;   // 반복 플레이(처음이 아닌 미니게임·합치기·도안)로 하루에 받을 수 있는 실뭉치 상한 (startDay에서 초기화, 테스트 모드는 무제한)
function capRepeat(y){if(!y||SejinSave.testMode)return y;const ok=Math.max(0,Math.min(y,REPEAT_YARN_LIMIT-repeatYarnToday));repeatYarnToday+=ok;return ok;}
const PET_XP_LIMIT=10,PET_COIN_LIMIT=30;let petsToday=0;   // resets each day (startDay)
function render(){
 $('#needs').innerHTML=Object.entries(needs).map(([k,v])=>`<div class="need${v<40?' low':''}"><div><span>${k}</span><b>${v}</b></div><div class="bar"><i style="width:${v}%;background:${{배부름:'var(--butter)',청결:'var(--sky)',기분:'var(--pink)',에너지:'var(--lav)'}[k]}"></i></div></div>`).join('');
 $('#room').classList.toggle('dirty',needs.청결<40);$('#room').classList.toggle('night',night);
 const {lv,rest,need}=levelInfo();$('#xpBar').style.width=rest/need*100+'%';$('#lvText').textContent='Lv.'+lv;$('#stageText').textContent=(angelNow()?'🪽 천사 · ':'')+stageName(lv)+' · 친밀도';$('#yarn').textContent=yarn;
 if(shownLevel!==null&&lv>shownLevel)levelUp(lv);
 shownLevel=lv;renderPins();pick(pickedPlace);
}
// Level up (friendship only; places open by making dolls, see applyResults).
let shownLevel=null;
function levelUp(lv){
 setTimeout(()=>say(`친밀도 Lv.${lv}! 우리 더 친해졌다.`),1200);
 note(`세진이와 더 친해졌다. (Lv.${lv})`);
}
const say=t=>$('#bubble').textContent=t;
const up=(k,n)=>needs[k]=Math.min(100,needs[k]+n);
function act(a){
 if(night&&a!=='sleep'){say('쿨… 쿨…');return;}
 if(a==='food'){up('배부름',25);xp+=5;say('냠… 고마워. 따뜻하다.');}
 if(a==='wash'){up('청결',35);xp+=5;say(needs.청결>60?'방이 반짝반짝해졌어!':'조금 더 치우면 좋겠다…');}
 // Petting: mood always goes up, but friendship xp only for the first PET_XP_LIMIT pets of the day
 // (and yarn coins only up to PET_COIN_LIMIT), so tapping fast cannot farm levels or 실뭉치.
 if(a==='pet'){up('기분',12);petsToday++;if(petsToday<=PET_XP_LIMIT)xp+=8;
  say(petsToday===PET_XP_LIMIT+1?'오늘은 많이 쓰다듬어 줬네… 고마워. (오늘 경험치는 다 받았어요)':['…헤헤.','부끄러워…','조금 더 해 줘.'][Math.floor(Math.random()*3)]);}
 if(a==='knit'){tab('work');return;}
 if(a==='out'){$('#outHint').textContent=needs.기분<40?'"오늘은 좀 기운이 없어…" 기분이 낮아요. 친구를 만나면 기분이 좋아질지도 몰라요.':'가고 싶은 건물을 눌러 보세요. ⚡ 에너지 '+needs.에너지+' / 100 · 뜨개 달리기 한 판에만 15를 써요. 건물 안의 게임과 이야기는 에너지를 쓰지 않아요.';tab('out');return;}
 if(a==='sleep'){night=!night;say(night?'잘 자… 내일 또 와 줄 거지?':'잘 잤다! 오늘도 같이 있자.');}
 render();
}
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
$('#outBtn').onclick=()=>act('out');
// Clicker bonus: petting Sejin sometimes drops a yarn coin (+1).
const COIN_CHANCE=.4,COIN_COLORS=['#8fc3e0','#f2a7b5','#f5d58a','#a9cfa4','#c9b3e6'];
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
function dropCoin(){
 const room=$('#room'),coin=document.createElement('i'),plus=document.createElement('span');
 coin.className='coin';coin.style.backgroundColor=COIN_COLORS[Math.floor(Math.random()*COIN_COLORS.length)];
 plus.className='plus';plus.textContent='+1';room.append(coin,plus);
 const dx=(Math.random()<.5?-1:1)*(40+Math.random()*50),spin=dx*4;
 if(still)coin.remove();
 else coin.animate([{transform:'translate(0,0) scale(.5)'},{transform:`translate(${dx*.45}px,-70px) rotate(${spin*.4}deg)`,offset:.35},{transform:`translate(${dx}px,64px) rotate(${spin}deg)`,offset:.75},{transform:`translate(${dx*1.08}px,50px) rotate(${spin*1.1}deg)`,offset:.87},{transform:`translate(${dx*1.14}px,64px) rotate(${spin*1.2}deg)`}],{duration:900,easing:'ease-in',fill:'forwards'}).onfinish=()=>coin.animate([{opacity:1},{opacity:0,transform:getComputedStyle(coin).transform+' translateY(-6px)'}],{duration:500,delay:300,fill:'forwards'}).onfinish=()=>coin.remove();
 plus.animate([{opacity:0,transform:'translate(-50%,8px)'},{opacity:1,transform:'translate(-50%,-6px)',offset:.25},{opacity:0,transform:'translate(-50%,-34px)'}],{duration:still?600:1000,easing:'ease-out',fill:'forwards'}).onfinish=()=>plus.remove();
 yarn+=1;render();const y=$('.yarn');y.classList.remove('bump');void y.offsetWidth;y.classList.add('bump');
}
$('#sejin').onclick=()=>{act('pet');if(!night&&petsToday<=PET_COIN_LIMIT&&Math.random()<COIN_CHANCE)dropCoin();};
function tab(t){document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>tab(b.dataset.go));
// Places, unlock levels and the friendship curve live in ../sejin-places.js (shared with place.html).
const {PLACES,LEVEL_XP,stageName}=SejinPlaces;
const levelInfo=()=>SejinPlaces.levelInfo(xp);
const level=()=>levelInfo().lv;
const isOpen=p=>SejinPlaces.isOpen(p,dolls);   // places open by finished dolls (dolls is declared below; used only after load)
const map=$('#map'),walker=$('#walker'),card=$('#placeCard');
const pct=(v,max)=>v/max*100+'%';
// Tap a building (or its name tag): Sejin walks there and a bright info card pops up.
// Tap the same building again, or 들어가기 in the card, to go in (open places → ../place.html).
let pickedPlace='home',cardOpen=false;
PLACES.forEach(p=>{
 const [l,t,r,b]=p.hit,zone=document.createElement('button');
 zone.className='map-zone';zone.dataset.zone=p.id;zone.setAttribute('aria-label',p.name+' 건물');zone.tabIndex=-1;
 Object.assign(zone.style,{left:pct(l,360),top:pct(t,320),width:pct(r-l,360),height:pct(b-t,320)});
 zone.onclick=()=>tapPlace(p.id);map.insertBefore(zone,walker);
 const pin=document.createElement('button');pin.dataset.place=p.id;pin.setAttribute('aria-pressed','false');pin.style.left=pct(p.x,360);pin.style.top=pct(p.y,320);pin.onclick=()=>tapPlace(p.id);map.appendChild(pin);});
// 받은 친구 의뢰를 지도 화면 위쪽에 요약: 어떤 소품이 몇 개 필요한지, 가방에 몇 개 있는지.
function renderMapQuests(){
 const box=document.getElementById('mapQuests');if(!box||!window.SejinQuests)return;
 const Q=SejinQuests,have=id=>bag[id]||0;
 const rows=SejinPlaces.FRIENDS.filter(f=>{const pl=SejinPlaces.byId(f.place);return pl&&isOpen(pl);}).map(f=>{

 else if(!made&&village)action='<p class="miss-note">천사 마을에서 이곳의 퍼즐을 풀어 열면 만들 수 있어요. 인형을 꼭 만들 필요는 없어요.</p>';

 else if(partner===d.id)action='<button disabled>지금 방에서 함께 지내는 중</button>';
 else if(!d.art)action='<button disabled>방에서 함께 지내기는 준비 중이에요</button>';
 else action=`<button data-partner="${d.id}">이 친구와 방에서 지내기</button>`;
 $('#sheetBody').innerHTML=pic+`<p class="doll-about">${made||reg?d.about:'어떤 친구일까? 작업실에서 만들어 보세요.'}</p><div class="doll-act">${action}</div>`;
 $('#sheetBody [data-partner]')?.addEventListener('click',b=>{partner=b.currentTarget.dataset.partner;render();fillSheet();say('오늘은 우리 같이 지내자!');});
 // 천사 마을 인형 만들기: 실뭉치만 내면 바로 도감에 들어온다 (게임 없이, 선택 사항)
 $('#sheetBody [data-make]')?.addEventListener('click',b=>{const id=b.currentTarget.dataset.make,dd=ALL_DOLLS().find(x=>x.id===id);if(!dd||dolls[id]||yarn<dd.cost)return;yarn-=dd.cost;dolls[id]=1;note(`${obj(dd.name)} 만들었다. 도감이 채워졌다.`);render();renderBook();fillSheet();say('와, 도감에 새 친구가 들어왔어!');save();});

// ---- Save: everything the room keeps is written to this browser after each change ----
function snapshot(){
 return {v:1,day,needs:{...needs},xp,yarn,night,bag:{...bag},placed:[...placed],ownedClothes:[...ownedClothes],wearing:{...wearing},
  progress:{...progress},claimed:[...claimed],diary:[...diary],dolls:{...dolls},dollsSeen:[...dollsSeen],partner,regenAt,napReadyAt,petsToday,repeatYarnToday};
}
function restore(s){
 if(!s||s.v!==1)return;
 Object.assign(needs,s.needs);xp=s.xp??xp;yarn=s.yarn??yarn;night=!!s.night;
 Object.keys(bag).forEach(k=>delete bag[k]);Object.assign(bag,s.bag);
 placed.clear();(s.placed||[]).filter(id=>ITEMS[id]).forEach(id=>{placed.add(id);room.classList.add('deco-'+id);});
 ownedClothes.clear();(s.ownedClothes||[]).filter(id=>CLOTHES[id]).forEach(id=>ownedClothes.add(id));
 Object.assign(wearing,s.wearing);Object.assign(dolls,s.dolls);(s.dollsSeen||[]).forEach(id=>dollsSeen.add(id));if(DOLL_BOOK.some(d=>d.id===s.partner))partner=s.partner;regenAt=s.regenAt||regenAt;napReadyAt=s.napReadyAt||0;petsToday=s.petsToday||0;repeatYarnToday=s.repeatYarnToday||0;
 day=s.day||day;Object.assign(progress,s.progress);(s.claimed||[]).forEach(id=>claimed.add(id));
 diary.clear();(s.diary||[]).forEach(([t,n])=>diary.set(t,n));
}
// A new day brings new requests and a fresh diary page.
function startDay(){
 const now=SejinSave.today();if(now===day)return false;
 day=now;Object.keys(progress).forEach(k=>progress[k]=0);claimed.clear();diary.clear();petsToday=0;repeatYarnToday=0;return true;
}
// Results left by minigames (knit.html) while the room was closed.
// A doll is made by one run: 세진이 인형 by reaching the end, the others by reaching the end with the doll's thread
// (DOLLS[].yarn) gathered in that same run (r.clear is then true). Thread left over — or from a run that did not
// make the doll — becomes 실뭉치.
function applyResults(){
 const firsts=[];let coins=0;
 for(const r of SejinSave.takeResults()){
  if(r.game==='energy'){needs.에너지=Math.max(0,needs.에너지-(r.use||0));continue;}   // a doll run started
  if(r.game==='merge'){const y=capRepeat(r.yarn||0);yarn+=y;xp+=2;note(`실 가게에서 실타래 합치기를 했다. (점수 ${r.score})`);if(y)setTimeout(()=>gain('실타래 합치기 · 실뭉치 +'+y),1400);continue;}
  if(r.game==='pattern'){const y=r.first?(r.yarn||0):capRepeat(r.yarn||0);yarn+=y;xp+=r.first?10:2;setTimeout(()=>gain(y?'도안 완성 · 실뭉치 +'+y:'도안 완성 · 오늘 반복 보상은 다 받았어요'),1400);note(r.first?`공방에서 ${obj(r.name+' 도안')} 처음 완성했다!`:`공방에서 ${obj(r.name+' 도안')} 또 채웠다.`);continue;}
  if(r.game==='pickup'){for(const [id,c] of Object.entries(r.items||{})){if(!ITEMS[id])continue;bag[id]=(bag[id]||0)+c;note(`${r.place||'밖'}에서 ${ITEMS[id].name}을 주웠다.`);setTimeout(()=>gain(ITEMS[id].name+' +'+c),1200);}continue;}
  if(r.game==='craft'){const ok=Object.entries(r.uses||{}).every(([k,n])=>(bag[k]||0)>=n);if(ok){for(const [k,n] of Object.entries(r.uses||{}))bag[k]-=n;for(const [k,n] of Object.entries(r.makes||{}))bag[k]=(bag[k]||0)+n;const nm=Object.keys(r.makes||{}).map(k=>ITEMS[k]&&ITEMS[k].name).filter(Boolean).join(', ');note(`공방에서 ${nm} 만들었다.`);xp+=3;}continue;}
  if(r.game==='sell'){const it=ITEMS[r.item],n=r.count||1;if(it&&(bag[r.item]||0)>=n){bag[r.item]-=n;yarn+=r.gain||0;note(`실 가게에 ${it.name}${n>1?' '+n+'개':''} 팔았다.`);}continue;}
  if(r.game==='spend'){yarn=Math.max(0,yarn-(r.cost||0));continue;}
  if(r.game==='buy'){const it=ITEMS[r.item],n=r.count||1;if(it&&yarn>=(r.cost||0)){yarn-=r.cost||0;bag[r.item]=(bag[r.item]||0)+n;note(`${r.place||'가게'}에서 ${obj(it.name)} 샀다.`);}continue;}
  if(r.game==='give'){const it=ITEMS[r.item],n=r.count||1;if(it&&(bag[r.item]||0)>=n){bag[r.item]-=n;yarn+=r.reward||0;xp+=6;note(`${r.friend||'친구'}에게 ${it.name} ${n}개를 선물했다. 고맙다고 했다.`);setTimeout(()=>gain('미션 완료 · 실뭉치 +'+(r.reward||0)),1400);}continue;}
  if(r.game==='minigame'){const raw=r.yarn||0,y=(r.first||/친구 부탁/.test(r.label||''))?raw:capRepeat(raw);yarn+=y;xp+=r.first?6:2;setTimeout(()=>gain((r.label||'미니게임')+(y||!raw?' · 실뭉치 +'+y:' · 오늘 반복 보상은 다 받았어요')),1400);note(`${r.place||'밖'}에서 ${r.label} 놀이를 했다.`);continue;}
  if(r.game!=='knit')continue;
  const d=SejinPlaces.dollById(r.doll)||SejinPlaces.dollById('sejin');
  if(r.clear)coins+=r.reward||0;   // thread picked up in a run stays in the run; a finished doll pays a fixed reward
  if(!r.clear)continue;
  progressQuest('knit');xp+=10;
  if(!dolls[d.id])firsts.push(d);dolls[d.id]=(dolls[d.id]||0)+1;note(`작업실에서 ${obj(d.name)} 끝까지 떴다!`);
 }
 firsts.forEach((d,i)=>setTimeout(()=>announceDoll(d),2200+i*2600));
 if(coins){yarn+=coins;note(`인형을 완성해서 실뭉치 ${coins}개를 받았다.`);setTimeout(()=>gain('인형 완성 · 실뭉치 +'+coins),900);}
}
// A first doll goes into the book and may open a place on the map.
function announceDoll(d){const opened=PLACES.filter(p=>p.unlock===d.id).map(p=>p.name);
 say(`첫 ${d.name} 완성! 도감에 등록됐어.`+(opened.length?` 이제 ${opened.join(', ')}에 갈 수 있어!`:''));
 if(opened.length)note(`${opened.join(', ')}에 갈 수 있게 됐다.`);}
const save=()=>SejinSave.save(snapshot());
// Play-test switch: raising-mockup.html?test=on opens every doll stage (places and the doll book stay as they are).
{const t=new URLSearchParams(location.search).get('test');if(t==='on')SejinSave.testMode=true;if(t==='off')SejinSave.testMode=false;}
// Energy comes back by itself over time (also while the game was closed).
function applyRegen(){const r=SejinSave.regen({needs,regenAt});needs.에너지=r.energy;regenAt=r.regenAt;}
restore(SejinSave.load());applyRegen();startDay();applyResults();
setInterval(()=>{const before=needs.에너지;applyRegen();if(needs.에너지!==before)render();},30000);
// Workroom: one 뜨개 달리기 stage per doll, easiest first (★ = difficulty). A doll opens when the one before
// it has been finished; finishing a doll may also open a place on the map.
function renderWork(){
 const test=SejinSave.testMode;
 $('#workList').innerHTML=(test?'<p class="miss-note">테스트 모드: 모든 스테이지가 열려 있어요. 끄려면 주소 끝에 ?test=off 를 붙여 열어 주세요.</p>':'')+DOLL_BOOK.map((d,i)=>{const made=dolls[d.id],open=test||i===0||dolls[DOLL_BOOK[i-1].id],place=PLACES.find(p=>p.unlock===d.id);
  const info=[d.stage+' 스테이지',d.yarn?'한 판에 실 '+d.yarn+'개':'',made?made+'개 완성':'',place?(made?place.name+' 열림':'완성하면 '+place.name+' 열림'):''].filter(Boolean).join(' · ');
  const thumb=d.art?'<i class="doll"></i>':(made&&d.card)?`<span role="img" aria-label="${d.name} 그림" style="display:block;width:48px;height:48px;background:url(../assets/${d.card}) center/contain no-repeat"></span>`:open?'<i class="doll" style="filter:grayscale(1) opacity(.45)"></i>':'?';
  const go=`<a class="play" href="../knit.html${i?'?doll='+d.id:''}">${made?'또 뜨기':'뜨개 시작'}</a>`;
  return `<div class="item${open?'':' locked'}"><div class="thumb">${thumb}</div><div style="flex:1;min-width:0"><b>${d.name}</b> ${'★'.repeat(i+1)}${d.example?' <small>(예시)</small>':''}<p>${open?info:obj(DOLL_BOOK[i-1].name)+' 먼저 완성하면 열려요'}</p></div>${open?go:'<button disabled>잠김</button>'}</div>`;}).join('');
}
function renderGoal(){
 const tn=document.querySelector('.testnote');if(tn)tn.hidden=!SejinSave.testMode;   // '시험판' 문구는 테스트 모드에서만
 const g=$('#goal');if(!g)return;
 const next=DOLL_BOOK.find(d=>!dolls[d.id]);
 g.innerHTML=next?(next.id==='sejin'?'🎯 오늘 할 일: 첫 세진이 인형 만들기':`🎯 다음 목표: ${obj(next.name)} 만들기`)+'<small>작업실에서 뜨개 달리기를 해요 · 눌러서 가기</small>':'🎯 오늘 할 일: 친구 부탁 들어주기<small>나가기 지도에서 친구를 만나 보세요 · 눌러서 가기</small>';
 g.dataset.go=next?'work':'out';
}
const renderAll=render;render=()=>{renderAll();renderGoal();renderBook();renderWork();save();};
const questProgress=progressQuest;progressQuest=id=>{questProgress(id);save();};
// Coming back with the browser's back button can show the old page from memory: re-read results then.
addEventListener('pageshow',e=>{if(e.persisted){applyResults();render();}});
// Day change while the room stays open.
setInterval(()=>{if(startDay()){render();if(sheetKind==='quest'||sheetKind==='diary')fillSheet();}},60000);
addEventListener('pagehide',save);
const tabBefore=tab;tab=t=>{tabBefore(t);if(t==='book')setTimeout(viewBook,250);};
// Back from a place page (place.html → raising-mockup.html#out=workshop): open the map at that place.
if(location.hash==='#work'){history.replaceState(null,'',location.pathname+location.search);tab('work');}   // back from 뜨개 달리기
if(location.hash==='#shop'){history.replaceState(null,'',location.pathname+location.search);shopCat='snack';tab('shop');}   // "간식 먹으러 가기" from a run
const backToMap=location.hash.match(/^#out(?:=(\w+))?$/);
if(backToMap){history.replaceState(null,'',location.pathname+location.search);tab('out');if(SejinPlaces.byId(backToMap[1])){pickedPlace=backToMap[1];cardOpen=true;card.hidden=false;}}
dress();
render();
</script>
